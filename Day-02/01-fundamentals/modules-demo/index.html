<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ES Modules Demo - Day 2</title>
    <style>
      :root {
        --color-bg: #0f172a;
        --color-card: #1e293b;
        --color-text: #f8fafc;
        --color-accent: #38bdf8;
        --color-border: #334155;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text);
        padding: 2rem 1rem;
        display: flex;
        justify-content: center;
      }
      main {
        max-width: 600px;
        width: 100%;
        background: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
        color: var(--color-accent);
      }
      p {
        margin-bottom: 1rem;
        line-height: 1.5;
        color: #cbd5e1;
      }
      #demo-output {
        background: #090d16;
        padding: 1rem;
        border-radius: 6px;
        border: 1px solid var(--color-border);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      #demo-output ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      #demo-output li {
        padding: 0.25rem 0;
        border-bottom: 1px solid #1e293b;
      }
      #demo-output li:last-child {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ES Modules Demonstration</h1>
      <p>
        This page demonstrates standard ES module loading via
        <code>&lt;script type="module" src="main.js"&gt;</code>, importing named functions and default exports from
        <code>math.js</code>.
      </p>
      <section aria-labelledby="results-title">
        <h2 id="results-title" style="font-size: 1.1rem; margin-bottom: 0.5rem">Calculations from Module Import</h2>
        <div id="demo-output" role="region" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
