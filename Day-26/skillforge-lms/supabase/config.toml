#:schema https://supabase.com/schemas/config/v1.json
project_id = "skillforge-lms"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5178"
additional_redirect_urls = ["http://localhost:5178", "http://127.0.0.1:5178"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.rate_limit]
email_sent = 1000
token_refresh = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
