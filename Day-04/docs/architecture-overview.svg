<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="600" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Window Header -->
  <rect x="0" y="0" width="1000" height="50" rx="16" fill="#0b1120" />
  <circle cx="30" cy="25" r="7" fill="#ef4444" />
  <circle cx="54" cy="25" r="7" fill="#f59e0b" />
  <circle cx="78" cy="25" r="7" fill="#10b981" />
  <text x="500" y="31" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    DevHub Architecture &bull; React 19 Component Flow &bull; Day 4 Basics
  </text>

  <!-- App Root Node -->
  <g transform="translate(380, 80)">
    <rect width="240" height="64" rx="12" fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.3" />
    <rect width="240" height="64" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="120" y="28" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ROOT COMPONENT</text>
    <text x="120" y="48" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">App.jsx</text>
  </g>

  <!-- Connecting Lines -->
  <!-- App to Navbar -->
  <path d="M 400 144 L 200 200" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4" />
  <!-- App to UserList -->
  <path d="M 450 144 L 380 200" fill="none" stroke="#3b82f6" stroke-width="2" />
  <!-- App to ProductList -->
  <path d="M 550 144 L 620 200" fill="none" stroke="#3b82f6" stroke-width="2" />
  <!-- App to JsxFeaturesDemo -->
  <path d="M 600 144 L 800 200" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4" />

  <!-- Level 1: Components -->

  <!-- Navbar -->
  <g transform="translate(100, 200)">
    <rect width="180" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">LAYOUT PRIMITIVE</text>
    <text x="90" y="46" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">Navbar.jsx</text>
    <text x="90" y="60" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">props: links[]</text>
  </g>

  <!-- UserList -->
  <g transform="translate(310, 200)">
    <rect width="180" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="26" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">LIST RECONCILER</text>
    <text x="90" y="46" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">UserList.jsx</text>
    <text x="90" y="60" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">key={user.id}</text>
  </g>

  <!-- ProductList -->
  <g transform="translate(530, 200)">
    <rect width="180" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="26" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">COMPLEX PROPS &amp; COND</text>
    <text x="90" y="46" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">ProductList.jsx</text>
    <text x="90" y="60" fill="#fbbf24" font-family="monospace" font-size="10" text-anchor="middle">key={product.id}</text>
  </g>

  <!-- JsxFeaturesDemo -->
  <g transform="translate(740, 200)">
    <rect width="180" height="70" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="26" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">JSX MASTERCLASS</text>
    <text x="90" y="46" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">JsxFeaturesDemo</text>
    <text x="90" y="60" fill="#e879f9" font-family="monospace" font-size="10" text-anchor="middle">rules 1 to 6</text>
  </g>

  <!-- Level 2 Connecting Lines -->
  <!-- UserList to UserCard -->
  <path d="M 400 270 L 400 330" fill="none" stroke="#10b981" stroke-width="2" />
  <!-- ProductList to ProductCard -->
  <path d="M 590 270 L 550 330" fill="none" stroke="#f59e0b" stroke-width="2" />
  <!-- ProductList to EmptyState -->
  <path d="M 650 270 L 710 330" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3" />

  <!-- Level 2 Components -->

  <!-- UserCard -->
  <g transform="translate(310, 330)">
    <rect width="180" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="90" y="24" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">CARD CONTAINER</text>
    <text x="90" y="44" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">UserCard.jsx</text>
    <text x="90" y="60" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">isOnline (ternary)</text>
    <text x="90" y="72" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">composition: Card</text>
  </g>

  <!-- ProductCard -->
  <g transform="translate(510, 330)">
    <rect width="170" height="80" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="85" y="24" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ITEM CARD</text>
    <text x="85" y="44" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">ProductCard.jsx</text>
    <text x="85" y="60" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">product.tags[] map</text>
    <text x="85" y="72" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">inStock (pill badge)</text>
  </g>

  <!-- EmptyState -->
  <g transform="translate(695, 330)">
    <rect width="160" height="80" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4" />
    <text x="80" y="24" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">CONDITIONAL BRANCH</text>
    <text x="80" y="44" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">EmptyState.jsx</text>
    <text x="80" y="60" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">empty list fallback</text>
    <text x="80" y="72" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">action slot button</text>
  </g>

  <!-- Level 3 Primitives (Shared) -->
  <!-- Card Primitive -->
  <g transform="translate(230, 470)">
    <rect width="250" height="68" rx="10" fill="#0b1120" stroke="#3b82f6" stroke-width="1.5" />
    <text x="125" y="26" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">PRIMITIVE: Card.jsx</text>
    <text x="125" y="46" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">composition: {children}</text>
  </g>

  <!-- Button Primitive -->
  <g transform="translate(520, 470)">
    <rect width="250" height="68" rx="10" fill="#0b1120" stroke="#3b82f6" stroke-width="1.5" />
    <text x="125" y="26" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">PRIMITIVE: Button.jsx</text>
    <text x="125" y="46" fill="#f8fafc" font-family="monospace" font-size="12" text-anchor="middle">variant='primary' · onClick</text>
  </g>

  <!-- Primitive Connection Lines -->
  <path d="M 400 410 L 355 470" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3" />
  <path d="M 595 410 L 645 470" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3" />
  <path d="M 775 410 L 660 470" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3" />

  <!-- Footer Info Label -->
  <text x="500" y="575" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle">
    16 components cleanly modularized &bull; ESLint verified &bull; React 19 production build passing
  </text>
</svg>
